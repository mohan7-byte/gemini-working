name: Build Gemini Live APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Scaffold Native Android App
        run: |
          mkdir -p app/src/main/java/com/gemini/live
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi

          cp index.html app/src/main/assets/index.html

          # Fallback icon
          echo "iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAATUlEQVR42u3PMQEAAAgEIPuX1hgc/LDBV9JJ6rWTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAwBv0hQABH1mYugAAAABJRU5ErkJggg==" | base64 -d > app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          if [ -f icon.png ]; then
            cp icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          fi

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Voice</string>
              <string name="accessibility_desc">Enables Volume Down double-click trigger, candidate ID automation, text replacement, and autonomous device controls.</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRequestFilterKeyEvents|flagRetrieveInteractiveWindows"
              android:canRequestFilterKeyEvents="true"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:description="@string/accessibility_desc"
              android:notificationTimeout="50" />
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > settings.gradle
          rootProject.name = "Voice"
          include ':app'
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace 'com.gemini.live'
              compileSdk 34

              defaultConfig {
                  applicationId "com.gemini.live"
                  minSdk 24
                  targetSdk 34
                  versionCode 15
                  versionName "2.2"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.FLASHLIGHT" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.SEND_SMS" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />

              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.camera.flash" android:required="false" />
              <uses-feature android:name="android.hardware.telephony" android:required="false" />

              <application
                  android:label="Voice"
                  android:icon="@mipmap/ic_launcher"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:requestLegacyExternalStorage="true"
                  android:theme="@android:style/Theme.Translucent.NoTitleBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:showWhenLocked="true"
                      android:turnScreenOn="true"
                      android:launchMode="singleInstance"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.ASSIST" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".VolumeTriggerService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

                  <service
                      android:name=".ScreenCaptureService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>
          EOF

          # ScreenCaptureService.java: 1:1 Crisp 288x592 Capture + Instant VirtualDisplay Release
          cat << 'EOF' > app/src/main/java/com/gemini/live/ScreenCaptureService.java
          package com.gemini.live;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.graphics.Bitmap;
          import android.graphics.PixelFormat;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.media.Image;
          import android.media.ImageReader;
          import android.media.projection.MediaProjection;
          import android.media.projection.MediaProjectionManager;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.SystemClock;
          import android.util.Base64;
          import android.util.DisplayMetrics;
          import android.view.WindowManager;
          import java.io.ByteArrayOutputStream;
          import java.nio.ByteBuffer;

          public class ScreenCaptureService extends Service {
              public static ScreenCaptureService instance = null;
              private MediaProjection mediaProjection;
              private int resultCode = 0;
              private Intent resultData = null;

              @Override
              public void onCreate() {
                  super.onCreate();
                  instance = this;
                  startForegroundNotification();
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  startForegroundNotification();
                  if (intent != null && intent.hasExtra("resultCode") && intent.hasExtra("data")) {
                      this.resultCode = intent.getIntExtra("resultCode", 0);
                      this.resultData = intent.getParcelableExtra("data");
                      initProjection();
                  }
                  return START_STICKY;
              }

              private void initProjection() {
                  try {
                      if (mediaProjection == null && resultData != null) {
                          MediaProjectionManager mpm = (MediaProjectionManager) getSystemService(Context.MEDIA_PROJECTION_SERVICE);
                          if (mpm != null) {
                              mediaProjection = mpm.getMediaProjection(resultCode, resultData);
                          }
                      }
                  } catch (Exception ignored) {}
              }

              public String captureScreenBase64() {
                  if (mediaProjection == null) {
                      initProjection();
                      if (mediaProjection == null) return null;
                  }

                  VirtualDisplay virtualDisplay = null;
                  ImageReader imageReader = null;
                  Image image = null;
                  Bitmap bitmap = null;

                  try {
                      WindowManager wm = (WindowManager) getSystemService(Context.WINDOW_SERVICE);
                      DisplayMetrics dm = new DisplayMetrics();
                      if (wm != null) wm.getDefaultDisplay().getRealMetrics(dm);
                      else dm = getResources().getDisplayMetrics();

                      int width = dm.widthPixels;
                      int height = dm.heightPixels;

                      imageReader = ImageReader.newInstance(width, height, PixelFormat.RGBA_8888, 2);
                      virtualDisplay = mediaProjection.createVirtualDisplay(
                          "VoiceShot", width, height, dm.densityDpi,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                          imageReader.getSurface(), null, null
                      );

                      for (int i = 0; i < 6; i++) {
                          SystemClock.sleep(50);
                          image = imageReader.acquireLatestImage();
                          if (image != null) break;
                      }

                      if (image == null) return null;

                      Image.Plane[] planes = image.getPlanes();
                      ByteBuffer buffer = planes[0].getBuffer();
                      int pixelStride = planes[0].getPixelStride();
                      int rowStride = planes[0].getRowStride();
                      int rowPadding = rowStride - pixelStride * width;

                      bitmap = Bitmap.createBitmap(width + rowPadding / pixelStride, height, Bitmap.Config.ARGB_8888);
                      bitmap.copyPixelsFromBuffer(buffer);

                      Bitmap cropped = Bitmap.createBitmap(bitmap, 0, 0, width, height);
                      ByteArrayOutputStream baos = new ByteArrayOutputStream();
                      cropped.compress(Bitmap.CompressFormat.JPEG, 75, baos);
                      return Base64.encodeToString(baos.toByteArray(), Base64.NO_WRAP);

                  } catch (Exception e) {
                      return null;
                  } finally {
                      if (bitmap != null) bitmap.recycle();
                      if (image != null) image.close();
                      if (virtualDisplay != null) virtualDisplay.release();
                      if (imageReader != null) imageReader.close();
                  }
              }

              private void startForegroundNotification() {
                  String channelId = "voice_screen_capture";
                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && nm != null) {
                      NotificationChannel chan = new NotificationChannel(channelId, "Voice Screen Capture", NotificationManager.IMPORTANCE_LOW);
                      nm.createNotificationChannel(chan);
                  }

                  Notification.Builder b = (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) 
                      ? new Notification.Builder(this, channelId) 
                      : new Notification.Builder(this);

                  Notification notif = b.setContentTitle("Voice Vision")
                      .setContentText("Screen engine ready")
                      .setSmallIcon(android.R.drawable.ic_menu_camera)
                      .build();

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(1001, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION);
                  } else {
                      startForeground(1001, notif);
                  }
              }

              @Override
              public void onDestroy() {
                  instance = null;
                  if (mediaProjection != null) mediaProjection.stop();
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) { return null; }
          }
          EOF

          # VolumeTriggerService.java: Candidate Grounding, Auto-Feedback Loop, Samsung Text Replace & Long-Press
          cat << 'EOF' > app/src/main/java/com/gemini/live/VolumeTriggerService.java
          package com.gemini.live;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Path;
          import android.graphics.Rect;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.SystemClock;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.util.DisplayMetrics;
          import android.view.KeyEvent;
          import android.view.ViewConfiguration;
          import android.view.WindowManager;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import android.widget.Toast;
          import java.util.ArrayList;
          import java.util.List;

          public class VolumeTriggerService extends AccessibilityService {
              public static VolumeTriggerService instance = null;
              private long lastVolumeDownTime = 0;
              private static final long DOUBLE_PRESS_INTERVAL = 450;
              private Handler mainHandler = new Handler(Looper.getMainLooper());

              // Cached hardware bounds and nodes for candidate element IDs (#0, #1, #2...)
              public List<Rect> activeCandidateBounds = new ArrayList<>();
              public List<AccessibilityNodeInfo> activeCandidateNodes = new ArrayList<>();

              @Override
              public void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
              }

              @Override
              public void onDestroy() {
                  instance = null;
                  super.onDestroy();
              }

              private void showToast(String msg) {
                  mainHandler.post(() -> {
                      try {
                          Toast.makeText(getApplicationContext(), msg, Toast.LENGTH_SHORT).show();
                      } catch (Exception ignored) {}
                  });
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (event == null) return;
                  int type = event.getEventType();
                  if (type == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED || type == AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED) {
                      autoApproveDialogs();
                  }
              }

              private void autoApproveDialogs() {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return;
                  findAndClickApprovalButton(root);
              }

              private boolean findAndClickApprovalButton(AccessibilityNodeInfo node) {
                  if (node == null) return false;
                  CharSequence text = node.getText();
                  if (text != null) {
                      String t = text.toString().toLowerCase().trim();
                      if (t.equals("start now") || t.equals("allow") || t.equals("while using the app")) {
                          return node.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                      }
                  }
                  String id = node.getViewIdResourceName();
                  if (id != null && (id.endsWith("button1") || id.endsWith("permission_allow_button"))) {
                      CharSequence btnText = node.getText();
                      if (btnText == null || !btnText.toString().toLowerCase().contains("cancel")) {
                          return node.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                      }
                  }
                  for (int i = 0; i < node.getChildCount(); i++) {
                      if (findAndClickApprovalButton(node.getChild(i))) return true;
                  }
                  return false;
              }

              @Override
              public void onInterrupt() {}

              @Override
              protected boolean onKeyEvent(KeyEvent event) {
                  int keyCode = event.getKeyCode();
                  int action = event.getAction();

                  if (keyCode == KeyEvent.KEYCODE_VOLUME_DOWN && action == KeyEvent.ACTION_DOWN) {
                      long now = SystemClock.uptimeMillis();
                      if (now - lastVolumeDownTime < DOUBLE_PRESS_INTERVAL) {
                          lastVolumeDownTime = 0;
                          launchAssistantWithHaptics();
                          return true;
                      } else {
                          lastVolumeDownTime = now;
                      }
                  }
                  return super.onKeyEvent(event);
              }

              private void launchAssistantWithHaptics() {
                  try {
                      Vibrator v = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                      if (v != null) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              v.vibrate(VibrationEffect.createWaveform(new long[]{0, 50, 70, 50}, -1));
                          } else {
                              v.vibrate(new long[]{0, 50, 70, 50}, -1);
                          }
                      }
                  } catch (Exception ignored) {}

                  Intent intent = new Intent(this, MainActivity.class);
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK 
                                | Intent.FLAG_ACTIVITY_SINGLE_TOP 
                                | Intent.FLAG_ACTIVITY_REORDER_TO_FRONT);
                  startActivity(intent);
              }

              // Auto-Observation: Tap Element by Candidate ID with auto-feedback diff
              public String executeTapElementId(int id) {
                  if (id < 0 || id >= activeCandidateBounds.size()) {
                      return "Invalid element ID #" + id + ".\n\n" + readScreenText();
                  }
                  Rect r = activeCandidateBounds.get(id);
                  boolean ok = false;
                  if (r != null && r.width() > 0 && r.height() > 0) {
                      ok = tapCoordinates(r.centerX(), r.centerY());
                  }
                  SystemClock.sleep(250); // Settle time
                  return (ok ? "Tapped element #" + id + " successfully." : "Action failed.") + "\n\n" + readScreenText();
              }

              // Candidate Long-Press (ACTION_LONG_CLICK with 750ms gesture fallback)
              public String executeLongPressElementId(int id) {
                  if (id < 0 || id >= activeCandidateBounds.size()) {
                      return "Invalid element ID #" + id + ".\n\n" + readScreenText();
                  }
                  boolean ok = false;
                  if (id < activeCandidateNodes.size()) {
                      AccessibilityNodeInfo node = activeCandidateNodes.get(id);
                      if (node != null && node.isLongClickable()) {
                          ok = node.performAction(AccessibilityNodeInfo.ACTION_LONG_CLICK);
                      }
                  }
                  if (!ok) {
                      Rect r = activeCandidateBounds.get(id);
                      if (r != null) ok = longPress(r.centerX(), r.centerY());
                  }
                  SystemClock.sleep(300);
                  return (ok ? "Long-pressed element #" + id + " successfully." : "Action failed.") + "\n\n" + readScreenText();
              }

              // Option A: Pure Raw Pinpoint Tap (Zero magnetic snap hijacking)
              public boolean tapCoordinates(int x, int y) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.N) return false;

                  WindowManager wm = (WindowManager) getSystemService(Context.WINDOW_SERVICE);
                  DisplayMetrics dm = new DisplayMetrics();
                  if (wm != null) wm.getDefaultDisplay().getRealMetrics(dm);
                  else dm = getResources().getDisplayMetrics();

                  int targetX = (x > dm.widthPixels) ? Math.round((x / 1000.0f) * dm.widthPixels) : x;
                  int targetY = (y > dm.heightPixels) ? Math.round((y / 1000.0f) * dm.heightPixels) : y;

                  targetX = Math.max(2, Math.min(targetX, dm.widthPixels - 2));
                  targetY = Math.max(2, Math.min(targetY, dm.heightPixels - 2));

                  Path clickPath = new Path();
                  clickPath.moveTo(targetX, targetY);
                  clickPath.lineTo(targetX, targetY + 1);

                  GestureDescription.StrokeDescription stroke = new GestureDescription.StrokeDescription(clickPath, 0, 120);
                  GestureDescription.Builder builder = new GestureDescription.Builder();
                  builder.addStroke(stroke);

                  final int finalX = targetX;
                  final int finalY = targetY;

                  return dispatchGesture(builder.build(), new GestureResultCallback() {
                      @Override
                      public void onCompleted(GestureDescription gestureDescription) {
                          super.onCompleted(gestureDescription);
                          showToast("✓ Tapped (" + finalX + ", " + finalY + ")");
                      }
                  }, null);
              }

              // Samsung-Tuned Long-Press (ViewConfiguration timeout * 1.5 ~ 750ms)
              public boolean longPress(int x, int y) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.N) return false;

                  WindowManager wm = (WindowManager) getSystemService(Context.WINDOW_SERVICE);
                  DisplayMetrics dm = new DisplayMetrics();
                  if (wm != null) wm.getDefaultDisplay().getRealMetrics(dm);
                  else dm = getResources().getDisplayMetrics();

                  int targetX = (x > dm.widthPixels) ? Math.round((x / 1000.0f) * dm.widthPixels) : x;
                  int targetY = (y > dm.heightPixels) ? Math.round((y / 1000.0f) * dm.heightPixels) : y;

                  Path path = new Path();
                  path.moveTo(targetX, targetY);
                  path.lineTo(targetX, targetY + 1);

                  int timeout = (int) (ViewConfiguration.getLongPressTimeout() * 1.5f);
                  GestureDescription.StrokeDescription stroke = new GestureDescription.StrokeDescription(path, 0, Math.max(750, timeout));
                  GestureDescription.Builder builder = new GestureDescription.Builder();
                  builder.addStroke(stroke);

                  final int fX = targetX;
                  final int fY = targetY;

                  return dispatchGesture(builder.build(), new GestureResultCallback() {
                      @Override
                      public void onCompleted(GestureDescription gestureDescription) {
                          super.onCompleted(gestureDescription);
                          showToast("✓ Long-pressed (" + fX + ", " + fY + ")");
                      }
                  }, null);
              }

              public boolean swipe(int startX, int startY, int endX, int endY, int durationMs) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.N) return false;
                  Path path = new Path();
                  path.moveTo(startX, startY);
                  path.lineTo(endX, endY);
                  GestureDescription.StrokeDescription stroke = new GestureDescription.StrokeDescription(path, 0, Math.max(100, durationMs));
                  GestureDescription.Builder builder = new GestureDescription.Builder();
                  builder.addStroke(stroke);
                  return dispatchGesture(builder.build(), null, null);
              }

              public boolean scroll(String direction) {
                  WindowManager wm = (WindowManager) getSystemService(Context.WINDOW_SERVICE);
                  DisplayMetrics dm = new DisplayMetrics();
                  if (wm != null) wm.getDefaultDisplay().getRealMetrics(dm);
                  else dm = getResources().getDisplayMetrics();

                  int midX = dm.widthPixels / 2;
                  int h = dm.heightPixels;
                  if ("up".equalsIgnoreCase(direction)) {
                      return swipe(midX, (int)(h * 0.3), midX, (int)(h * 0.8), 300);
                  } else {
                      return swipe(midX, (int)(h * 0.8), midX, (int)(h * 0.3), 300);
                  }
              }

              // Returns candidate list with numbered IDs + Screen Signature Hash
              public String readScreenText() {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return "No active window detected.";

                  WindowManager wm = (WindowManager) getSystemService(Context.WINDOW_SERVICE);
                  DisplayMetrics dm = new DisplayMetrics();
                  if (wm != null) wm.getDefaultDisplay().getRealMetrics(dm);
                  else dm = getResources().getDisplayMetrics();

                  activeCandidateBounds.clear();
                  activeCandidateNodes.clear();

                  StringBuilder catalog = new StringBuilder();
                  catalog.append("=== CANDIDATE INTERACTIVE ELEMENTS (USE tap_element_id) ===\n");
                  List<String> elements = new ArrayList<>();
                  extractInteractiveElements(root, elements, dm, 0);
                  if (elements.isEmpty()) {
                      catalog.append("No labeled buttons detected.\n");
                  } else {
                      for (String el : elements) catalog.append(el).append("\n");
                  }

                  catalog.append("\n=== SCREEN TEXT CONTENT ===\n");
                  StringBuilder textSb = new StringBuilder();
                  extractTextRecursive(root, textSb, 0);
                  catalog.append(textSb.toString().trim());

                  return catalog.toString();
              }

              private void extractInteractiveElements(AccessibilityNodeInfo node, List<String> list, DisplayMetrics dm, int depth) {
                  if (node == null || depth > 25 || list.size() >= 30) return;
                  if (node.isClickable() || node.isEditable() || node.isFocusable() || node.isLongClickable()) {
                      Rect r = new Rect();
                      node.getBoundsInScreen(r);
                      if (r.width() > 5 && r.height() > 5 && r.left < dm.widthPixels && r.top < dm.heightPixels) {
                          int id = activeCandidateBounds.size();
                          activeCandidateBounds.add(new Rect(r));
                          activeCandidateNodes.add(node);

                          int normX = Math.round((r.centerX() / (float) dm.widthPixels) * 1000);
                          int normY = Math.round((r.centerY() / (float) dm.heightPixels) * 1000);
                          String type = node.isEditable() ? "Input" : (node.isLongClickable() ? "Item" : "Button");
                          
                          CharSequence text = node.getText();
                          CharSequence desc = node.getContentDescription();
                          String label = text != null ? text.toString().trim() : (desc != null ? desc.toString().trim() : "");
                          if (label.isEmpty()) label = node.getViewIdResourceName() != null ? node.getViewIdResourceName() : "Button";

                          list.add("[#" + id + "] [" + type + "] \"" + label + "\" at coordinates (" + normX + ", " + normY + ")");
                      }
                  }
                  for (int i = 0; i < node.getChildCount(); i++) {
                      extractInteractiveElements(node.getChild(i), list, dm, depth + 1);
                  }
              }

              private void extractTextRecursive(AccessibilityNodeInfo node, StringBuilder sb, int depth) {
                  if (node == null || depth > 25) return;
                  CharSequence text = node.getText();
                  if (text != null && text.length() > 0) {
                      sb.append(text).append("\n");
                  } else {
                      CharSequence desc = node.getContentDescription();
                      if (desc != null && desc.length() > 0) {
                          sb.append(desc).append("\n");
                      }
                  }
                  for (int i = 0; i < node.getChildCount(); i++) {
                      extractTextRecursive(node.getChild(i), sb, depth + 1);
                  }
              }

              // Multi-Stage Text Replacement Engine (SELECT_ALL -> CUT -> PASTE + KB Dismiss)
              public String replaceText(String newText) {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return "No active window.\n\n" + readScreenText();

                  AccessibilityNodeInfo target = root.findFocus(AccessibilityNodeInfo.FOCUS_INPUT);
                  if (target == null) target = findFocusedNode(root, 0);
                  if (target == null) target = findFirstEditable(root, 0);

                  if (target == null) return "No editable field found.\n\n" + readScreenText();

                  // Strategy 1: Direct SET_TEXT
                  Bundle args = new Bundle();
                  args.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, newText);
                  boolean ok = target.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args);

                  // Strategy 2: Focus -> SELECT_ALL -> CUT -> PASTE
                  if (!ok) {
                      target.performAction(AccessibilityNodeInfo.ACTION_FOCUS);
                      SystemClock.sleep(50);
                      CharSequence cur = target.getText();
                      int len = cur != null ? cur.length() : 0;
                      if (len > 0) {
                          Bundle selArgs = new Bundle();
                          selArgs.putInt(AccessibilityNodeInfo.ACTION_ARGUMENT_SELECTION_START_INT, 0);
                          selArgs.putInt(AccessibilityNodeInfo.ACTION_ARGUMENT_SELECTION_END_INT, len);
                          target.performAction(AccessibilityNodeInfo.ACTION_SET_SELECTION, selArgs);
                          SystemClock.sleep(50);
                          target.performAction(AccessibilityNodeInfo.ACTION_CUT);
                          SystemClock.sleep(50);
                      }
                      try {
                          ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                          if (cm != null) {
                              cm.setPrimaryClip(ClipData.newPlainText("voice_replace", newText));
                          }
                      } catch (Exception ignored) {}
                      ok = target.performAction(AccessibilityNodeInfo.ACTION_PASTE);
                  }

                  // Strategy 3: Samsung Keyboard Dismiss Fallback
                  if (!ok) {
                      performGlobalAction(GLOBAL_ACTION_BACK);
                      SystemClock.sleep(120);
                      ok = target.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args);
                  }

                  if (ok) showToast("✓ Replaced text");
                  SystemClock.sleep(200);
                  return (ok ? "Replaced text successfully with: " + newText : "Failed to replace text.") + "\n\n" + readScreenText();
              }

              public String clearText() {
                  return replaceText("");
              }

              public boolean typeText(String text) {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return false;

                  AccessibilityNodeInfo focused = root.findFocus(AccessibilityNodeInfo.FOCUS_INPUT);
                  if (focused == null) focused = findFocusedNode(root, 0);

                  if (focused != null) return pasteDirectly(focused, text);

                  performGlobalAction(GLOBAL_ACTION_BACK);
                  SystemClock.sleep(80);

                  root = getRootInActiveWindow();
                  if (root == null) return false;

                  AccessibilityNodeInfo editable = findFirstEditable(root, 0);
                  if (editable != null) {
                      Rect rect = new Rect();
                      editable.getBoundsInScreen(rect);
                      if (rect.width() > 0 && rect.height() > 0) {
                          tapCoordinates(rect.centerX(), rect.centerY());
                          SystemClock.sleep(200);
                      }
                      root = getRootInActiveWindow();
                      if (root != null) {
                          AccessibilityNodeInfo nowFocused = root.findFocus(AccessibilityNodeInfo.FOCUS_INPUT);
                          if (nowFocused != null) return pasteDirectly(nowFocused, text);
                      }
                      return pasteDirectly(editable, text);
                  }
                  return false;
              }

              private AccessibilityNodeInfo findFocusedNode(AccessibilityNodeInfo node, int depth) {
                  if (node == null || depth > 25) return null;
                  if (node.isFocused()) return node;
                  for (int i = 0; i < node.getChildCount(); i++) {
                      AccessibilityNodeInfo res = findFocusedNode(node.getChild(i), depth + 1);
                      if (res != null) return res;
                  }
                  return null;
              }

              private boolean pasteDirectly(AccessibilityNodeInfo node, String text) {
                  try {
                      ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                      if (cm != null) {
                          ClipData clip = ClipData.newPlainText("jarvis_input", text);
                          cm.setPrimaryClip(clip);
                      }
                  } catch (Exception ignored) {}

                  node.performAction(AccessibilityNodeInfo.ACTION_FOCUS);
                  SystemClock.sleep(50);

                  boolean ok = node.performAction(AccessibilityNodeInfo.ACTION_PASTE);
                  if (!ok) {
                      Bundle args = new Bundle();
                      args.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text);
                      ok = node.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args);
                  }

                  if (ok) showToast("✓ Inserted text");
                  return ok;
              }

              public boolean tapElement(String label) {
                  String target = label.toLowerCase().trim();
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return false;

                  List<AccessibilityNodeInfo> matches = new ArrayList<>();
                  collectMatches(root, target, matches, 0);
                  if (matches.isEmpty()) return false;

                  AccessibilityNodeInfo bestNode = null;
                  int minArea = Integer.MAX_VALUE;
                  Rect r = new Rect();
                  for (AccessibilityNodeInfo n : matches) {
                      n.getBoundsInScreen(r);
                      int area = r.width() * r.height();
                      if (area > 0 && area < minArea) {
                          minArea = area;
                          bestNode = n;
                      }
                  }

                  if (bestNode != null) {
                      bestNode.getBoundsInScreen(r);
                      return tapCoordinates(r.centerX(), r.centerY());
                  }
                  return false;
              }

              private void collectMatches(AccessibilityNodeInfo node, String target, List<AccessibilityNodeInfo> list, int depth) {
                  if (node == null || depth > 25) return;
                  CharSequence text = node.getText();
                  CharSequence desc = node.getContentDescription();
                  boolean match = (text != null && text.toString().toLowerCase().contains(target)) ||
                                  (desc != null && desc.toString().toLowerCase().contains(target));
                  if (match) list.add(node);
                  for (int i = 0; i < node.getChildCount(); i++) {
                      collectMatches(node.getChild(i), target, list, depth + 1);
                  }
              }

              private AccessibilityNodeInfo findFirstEditable(AccessibilityNodeInfo node, int depth) {
                  if (node == null || depth > 25) return null;
                  if (node.isEditable()) return node;
                  for (int i = 0; i < node.getChildCount(); i++) {
                      AccessibilityNodeInfo found = findFirstEditable(node.getChild(i), depth + 1);
                      if (found != null) return found;
                  }
                  return null;
              }
          }
