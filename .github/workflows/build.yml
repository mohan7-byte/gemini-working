                      webView.evaluateJavascript("if (typeof autoConnectOnWake === 'function') autoConnectOnWake();", null);
                  }
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK) {
                      moveTaskToBack(true);
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }
          }
          EOF

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Compile Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK as Direct Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Voice-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release & Upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v2.2 --yes || true
          git tag -d v2.2 || true
          gh release create v2.2 app/build/outputs/apk/debug/app-debug.apk \
            --title "Voice v2.2 (SOTA Agent ReAct Engine)" \
            --notes "Voice v2.2: Candidate Long-Press, Samsung Keyboard-Dismiss Text Replacement/Clearing, Auto-Feedback Diff Loop, and Silent Real-Time Web Search." || true
